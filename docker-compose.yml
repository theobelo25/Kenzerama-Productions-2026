services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DIRECTUS_URL: ${DIRECTUS_URL:-http://directus:8055}
        DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
        NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-${DIRECTUS_URL:-http://directus:8055}}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Prisma (`InstagramCredential`, `OAuthState`). Precedence:
      #   1) INSTA_DATABASE_URL — hosted `insta` DB (staging parity) while Directus stays on local `kenzerama`
      #   2) DATABASE_URL
      #   3) local default (same DB as Directus in this compose file)
      DATABASE_URL: ${INSTA_DATABASE_URL:-${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/kenzerama?schema=public}}
      # Uses service name `directus` so app-to-CMS traffic stays in-network.
      DIRECTUS_URL: ${DIRECTUS_URL:-http://directus:8055}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      directus:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kenzerama}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kenzerama}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  directus:
    build:
      context: .
      dockerfile: Dockerfile.directus
    ports:
      - "8055:8055"
    volumes:
      - directus_uploads:/directus/uploads
    environment:
      DB_CLIENT: ${DIRECTUS_DB_CLIENT:-pg}
      DB_HOST: ${DIRECTUS_DB_HOST:-postgres}
      DB_PORT: ${DIRECTUS_DB_PORT:-5432}
      DB_DATABASE: ${DIRECTUS_DB_DATABASE:-kenzerama}
      DB_USER: ${DIRECTUS_DB_USER:-postgres}
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-postgres}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin}
      KEY: ${DIRECTUS_KEY:-replace-me-directus-key}
      SECRET: ${DIRECTUS_SECRET:-replace-me-directus-secret}
      REDIS_ENABLED: ${DIRECTUS_REDIS_ENABLED:-false}
      REDIS: ${DIRECTUS_REDIS:-redis://redis:6379}
      # Mux video extension (tb-mux-video). The endpoint reads these at
      # request time, so leaving them unset only disables uploads — Directus
      # still boots normally.
      MUX_TOKEN_ID: ${MUX_TOKEN_ID:-}
      MUX_TOKEN_SECRET: ${MUX_TOKEN_SECRET:-}
      # CSP: Data Studio + mux-player need Mux image/stream/manifest/storyboard
      # origins, blob: media (HLS/MSE), and gstatic for Chromecast (HTTP + HTTPS —
      # cast_sender loads http://www.gstatic.com/...). Matches Directus 11.17
      # defaults in api/src/app.ts, extended for tb-mux-video. See:
      # https://directus.io/docs/configuration/security-limits#csp
      CONTENT_SECURITY_POLICY_DIRECTIVES__IMG_SRC: "'self' data: blob: https://raw.githubusercontent.com https://avatars.githubusercontent.com https://image.mux.com"
      CONTENT_SECURITY_POLICY_DIRECTIVES__SCRIPT_SRC: "'self' 'unsafe-eval' https://www.gstatic.com http://www.gstatic.com"
      # image.mux.com: storyboard.vtt; *.edgemv.mux.com: manifests; *.cfcdn.mux.com: chunk segments
      CONTENT_SECURITY_POLICY_DIRECTIVES__MEDIA_SRC: "'self' blob: data: https://stream.mux.com https://image.mux.com https://*.edgemv.mux.com https://*.cfcdn.mux.com"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  directus_uploads:
