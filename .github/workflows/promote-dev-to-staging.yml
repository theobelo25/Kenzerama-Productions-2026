name: Schema Dev to Staging

on:
  push:
    branches:
      - development

jobs:
  promote:
    name: Schema Dev -> Staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: schema-staging
      cancel-in-progress: false
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      DIRECTUS_DATABASE_URL: ${{ secrets.STAGING_DIRECTUS_DATABASE_URL }}
      DIRECTUS_SCHEMA_APPLY_CMD: ${{ secrets.STAGING_DIRECTUS_SCHEMA_APPLY_CMD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate required configuration
        run: |
          if [ -z "${STAGING_DB_URL}" ]; then
            echo "Missing STAGING_DB_URL secret."
            exit 1
          fi
          if [ -z "${DIRECTUS_DATABASE_URL}" ] && [ -z "${DIRECTUS_SCHEMA_APPLY_CMD}" ]; then
            echo "Set STAGING_DIRECTUS_DATABASE_URL or STAGING_DIRECTUS_SCHEMA_APPLY_CMD."
            exit 1
          fi
          if [ ! -f "directus/schema.snapshot.yaml" ]; then
            echo "Missing directus/schema.snapshot.yaml in repository."
            exit 1
          fi

      - name: Make scripts executable
        run: chmod +x scripts/db/*.sh scripts/directus/*.sh

      - name: Back up staging DB
        run: |
          backup_file="staging-backup-$(date -u +%Y%m%dT%H%M%SZ).dump"
          echo "STAGING_BACKUP_FILE=${backup_file}" >> "$GITHUB_ENV"
          ./scripts/db/backup.sh "${STAGING_DB_URL}" "${backup_file}"

      - name: Apply Directus schema to staging
        run: ./scripts/directus/apply-schema.sh "directus/schema.snapshot.yaml"

      - name: Verify custom Directus interface artifacts
        run: node scripts/ci/verify-directus-custom-interfaces.mjs

      - name: Run staging schema health checks
        run: |
          psql "${STAGING_DB_URL}" -v ON_ERROR_STOP=1 -c "SELECT 1;"
          collection_count="$(psql "${STAGING_DB_URL}" -v ON_ERROR_STOP=1 -At -c "SELECT COUNT(*) FROM directus_collections;")"
          echo "directus_collections count: ${collection_count}"
          if [[ "${collection_count}" -eq 0 ]]; then
            echo "Schema apply did not create any Directus collections."
            exit 1
          fi

      - name: Upload promotion artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schema-dev-to-staging-artifacts
          path: ${{ env.STAGING_BACKUP_FILE }}
