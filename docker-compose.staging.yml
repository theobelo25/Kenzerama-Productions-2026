# Staging stack — service names are suffixed (-staging) so hostnames do not collide with
# production (directus, postgres, redis) on Dokploy's shared Docker network.
# Production keeps default names in docker-compose.production.yml.
#
#   docker compose -f docker-compose.staging.yml up -d --build
#
# Host ports: web 3001, postgres 5433, directus 8056, redis 6380 (with profile redis)

name: kenzerama-staging

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DIRECTUS_URL: ${DIRECTUS_URL:-http://directus-staging:8055}
        DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
        NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-${DIRECTUS_URL:-http://directus-staging:8055}}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${INSTA_DATABASE_URL:-${DATABASE_URL:-postgresql://postgres:postgres@postgres-staging:5432/kenzerama?schema=public}}
      DIRECTUS_URL: ${DIRECTUS_URL:-http://directus-staging:8055}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
    depends_on:
      postgres-staging:
        condition: service_healthy
      directus-staging:
        condition: service_started
    restart: unless-stopped

  postgres-staging:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kenzerama}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kenzerama}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  directus-staging:
    build:
      context: .
      dockerfile: Dockerfile.directus
    ports:
      - "8056:8055"
    volumes:
      - directus_staging_uploads:/directus/uploads
    environment:
      DB_CLIENT: ${DIRECTUS_DB_CLIENT:-pg}
      DB_HOST: ${DIRECTUS_DB_HOST:-postgres-staging}
      DB_PORT: ${DIRECTUS_DB_PORT:-5432}
      DB_DATABASE: ${DIRECTUS_DB_DATABASE:-kenzerama}
      DB_USER: ${DIRECTUS_DB_USER:-postgres}
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-postgres}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin}
      KEY: ${DIRECTUS_KEY:-replace-me-directus-key}
      SECRET: ${DIRECTUS_SECRET:-replace-me-directus-secret}
      REDIS_ENABLED: ${DIRECTUS_REDIS_ENABLED:-false}
      REDIS: ${DIRECTUS_REDIS:-redis://redis-staging:6379}
      MUX_TOKEN_ID: ${MUX_TOKEN_ID:-}
      MUX_TOKEN_SECRET: ${MUX_TOKEN_SECRET:-}
      CONTENT_SECURITY_POLICY_DIRECTIVES__IMG_SRC: "'self' data: blob: https://raw.githubusercontent.com https://avatars.githubusercontent.com https://image.mux.com"
      CONTENT_SECURITY_POLICY_DIRECTIVES__SCRIPT_SRC: "'self' 'unsafe-eval' https://www.gstatic.com http://www.gstatic.com"
      CONTENT_SECURITY_POLICY_DIRECTIVES__MEDIA_SRC: "'self' blob: data: https://stream.mux.com https://image.mux.com https://*.edgemv.mux.com https://*.cfcdn.mux.com"
    depends_on:
      postgres-staging:
        condition: service_healthy
    restart: unless-stopped

  redis-staging:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    profiles:
      - redis
    restart: unless-stopped

volumes:
  postgres_staging_data:
  directus_staging_uploads:
